# Configuração Netlify para Casa Clo
# Como é um site estático puro (HTML + CSS + JS), não precisa de build step.

[build]
  publish = "."

# Cabeçalhos de cache para imagens (nunca mudam — cache longo)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fontes auto-hospedadas: ficheiros com nome estável — cache longo
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS e JS: cache curto + revalidação
# (pode mudar com frequência, queremos que o browser verifique sempre)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML: igual ao CSS/JS — cache curto
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A plataforma de gestão (/gestao) vive na DECIMA CLOUD (serviço próprio
# Node+PostgreSQL) — nada dela é servido daqui; links antigos caem no site.
[[redirects]]
  from = "/gestao/*"
  to = "/"
  status = 302

# Cabeçalhos de segurança básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
